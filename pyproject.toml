[project]
name = "aliciadata-finance-backend"
version = "0.1.0"
description = "Backend for aliciadata-finance-frontend: ARIMA stock price models and portfolio optimization, uploaded to an S3-compatible bucket."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3",
    "exchange-calendars",
    "h5py",
    "ipywidgets",
    "jupyterlab",
    "massive",
    "matplotlib",
    "notebook",
    "numpy",
    "openpyxl",
    "pandas",
    "pandas-datareader",
    "plotly",
    "python-dateutil",
    "python-dotenv",
    "pyyaml",
    "requests",
    "scikit-learn",
    "scipy",
    "seaborn",
    "statsmodels",
    "tables",
    "tqdm",
]

[dependency-groups]
dev = [
    "black[jupyter]",
    "flake8",
    "pytest",
    "sphinx",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Hatchling auto-detects the package at src/aliciadata_finance_backend. uv installs
# it in editable mode, so scripts/ can import it with `uv run`.
